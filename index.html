<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각이 많아지면</title><meta name="description" content="머무는 시간이 생각을 키우는 움직이는 시각시."><style>
@font-face{font-family:Pear;src:url('assets/PearToucan-Regular.ttf') format('truetype');font-weight:400;font-display:block}@font-face{font-family:Neurimbo;src:url('assets/neurimboGothicRegular.otf') format('opentype');font-weight:400;font-display:block}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Arial,sans-serif}main{width:100%;height:100%;position:relative;touch-action:none}#scene{display:block;width:100%;height:100%;user-select:none}#help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 14px;border:1px solid #ddd;border-radius:30px;font-size:12px;letter-spacing:.03em;transition:opacity .6s;white-space:nowrap;pointer-events:none}#reset{position:absolute;right:17px;bottom:16px;width:32px;height:32px;border:1px solid #888;border-radius:50%;color:#888;background:transparent;cursor:pointer;font-size:22px;opacity:0;transition:opacity .2s}main:hover #reset,#reset:focus-visible{opacity:.65}#reset:hover{opacity:1}#start{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}#start:focus-visible{outline:2px solid #888;outline-offset:-8px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(prefers-reduced-motion:reduce){#help{transition:none}}
main,main *{cursor:none!important}#cursorDot{position:fixed;left:0;top:0;width:15px;height:15px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;transform:translate(-50%,-50%);z-index:9999;opacity:0}
</style></head><body><main id="art"><svg id="scene" viewBox="0 0 1920 1077" preserveAspectRatio="none" role="img" aria-label="생각이 많아지면 용기를 잃는 법. 생각 쪽에 머물면 생각이, 용기 쪽에 머물면 용기가 화면을 채웁니다.">
<defs><clipPath id="blackClip"><path id="blackPath"/></clipPath><clipPath id="whiteClip"><path id="whitePath"/></clipPath><clipPath id="thoughtClip"><path id="thoughtPath"/></clipPath><clipPath id="courageClip"><path id="couragePath"/></clipPath></defs>
<rect width="1920" height="1077" fill="white"/><path id="background" fill="black"/>
<g clip-path="url(#thoughtClip)"><g id="thought" fill="white" stroke="white" stroke-width="2" stroke-linejoin="miter"></g></g>
<g clip-path="url(#blackClip)" id="blackText" fill="white"></g>
<g clip-path="url(#courageClip)"><g id="bravery" fill="black" stroke="black" stroke-width="2" stroke-linejoin="miter"></g></g>
<g clip-path="url(#whiteClip)" id="whiteText" fill="black"></g>
</svg><button id="start" aria-label="클릭하여 시각시 시작"></button><p id="help" hidden></p><button id="reset" title="다시 시작 · R" aria-label="다시 시작">↺</button><span class="sr" id="status" aria-live="polite"></span></main><div id="cursorDot" aria-hidden="true"></div><script src="app.js?v=25"></script></body></html>
